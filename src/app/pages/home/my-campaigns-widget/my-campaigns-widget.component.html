<ion-grid>
  <ion-row *ngFor="let campaign of myCampaigns">
    <ion-col class="campaign-col-container" [class.campaign-expired]="isExpired(campaign)">
      <!-- Ribbon diagonale quando conclusa -->
      <div *ngIf="isExpired(campaign)" class="expired-ribbon-wrapper">
        <div class="expired-ribbon">
          {{ 'campaigns.expired' | translate }}
        </div>
      </div>
      <app-widget-campaign
        [campaign]="campaign"
        [header]="true"
      ></app-widget-campaign>
    </ion-col>
  </ion-row>
  <ng-container *ngIf="myCampaigns?.length <= 1">
    <ion-button
      class="discover-button"
      expand="block"
      color="playgo"
      (click)="discover()"
    >
      <ion-icon slot="start" name="search"></ion-icon>
      {{ "discovercampaignbutton" | translate }}
    </ion-button>
  </ng-container>
</ion-grid>
